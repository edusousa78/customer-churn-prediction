
services:
  api:
    build:
      context: .
      dockerfile: Dockerfile

    image: conecta-brasil-churn-api:1.0

    ports:
      - "127.0.0.1:8000:8000"

    restart: unless-stopped

    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=5)"
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
