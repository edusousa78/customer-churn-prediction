

name: Python Tests

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      # 1. Baixar o codigo do repositorio
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Configurar Python
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: 'pip'

      # 3. Instalar dependencias
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      # 4. Verificar dependencias
      - name: Check dependencies
        run: python -m pip check

      # 5. Verificar qualidade do codigo
      - name: Run Ruff lint
        run: python -m ruff check api src tests main.py

      # 6. Executar testes automatizados
      - name: Run automated tests
        run: python -m pytest -q

      # 7. Construir a imagem Docker
      - name: Build Docker image
        run: docker build -t conecta-brasil-churn-api:ci .

      # 8. Iniciar o container e verificar /health
      - name: Smoke test Docker container
        run: |
          docker run -d --name churn-api-ci -p 127.0.0.1:8000:8000 conecta-brasil-churn-api:ci

          for tentativa in {1..30}; do
            if curl --fail --silent --show-error http://127.0.0.1:8000/health; then
              echo ""
              echo "Smoke test aprovado: API respondeu HTTP 200."
              exit 0
            fi

            echo "Aguardando API iniciar... tentativa $tentativa"
            sleep 2
          done

          echo "Smoke test falhou."
          docker logs churn-api-ci
          exit 1

      # 9. Testar o endpoint de previsao de churn
      - name: Test churn prediction endpoint
        run: |
          python - <<'PY'
          import json
          import urllib.request

          url = "http://127.0.0.1:8000/prever"

          cliente = {
              "total_atendimentos": 7,
              "atendimentos_abertos": 4,
              "media_satisfacao": 1.5,
          }

          dados = json.dumps(cliente).encode("utf-8")

          requisicao = urllib.request.Request(
              url,
              data=dados,
              headers={"Content-Type": "application/json"},
              method="POST",
          )

          with urllib.request.urlopen(requisicao, timeout=10) as resposta:
              assert resposta.status == 200
              resultado = json.load(resposta)

          assert 0 <= resultado["probabilidade_churn"] <= 1
          assert resultado["classificacao"] == 1
          assert resultado["alerta"] is True
          assert resultado["threshold"] == 0.2

          print("Teste POST /prever aprovado.")
          print("Resposta:", resultado)
          PY

      # 10. Remover o container temporario
      - name: Remove Docker test container
        if: always()
        run: docker rm -f churn-api-ci || true
