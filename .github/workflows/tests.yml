
name: Python Tests

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      # 1. Baixar o repositorio
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Configurar Python
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: 'pip'

      # 3. Instalar dependencias
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      # 4. Verificar dependencias
      - name: Check dependencies
        run: python -m pip check

      # 5. Analisar qualidade do codigo
      - name: Run Ruff lint
        run: python -m ruff check api src tests main.py

      # 6. Executar testes automatizados
      - name: Run automated tests
        run: python -m pytest -q

      # 7. Construir imagem Docker
      - name: Build Docker image
        run: docker build -t conecta-brasil-churn-api:ci .

      # 8. Iniciar container e verificar /health
      - name: Smoke test Docker container
        run: |
          docker run -d --name churn-api-ci -p 127.0.0.1:8000:8000 conecta-brasil-churn-api:ci

          for tentativa in {1..30}; do
            if curl --fail --silent --show-error http://127.0.0.1:8000/health; then
              echo ""
              echo "Smoke test aprovado: API respondeu HTTP 200."
              exit 0
            fi

            echo "Aguardando API iniciar... tentativa $tentativa"
            sleep 2
          done

          echo "Smoke test falhou."
          docker logs churn-api-ci
          exit 1

      # 9. Testar previsao de churn
      - name: Test churn prediction endpoint
        run: |
          python - <<'PY'
          import json
          import urllib.request

          url = "http://127.0.0.1:8000/prever"

          cliente = {
              "total_atendimentos": 7,
              "atendimentos_abertos": 4,
              "media_satisfacao": 1.5,
          }

          dados = json.dumps(cliente).encode("utf-8")

          requisicao = urllib.request.Request(
              url,
              data=dados,
              headers={"Content-Type": "application/json"},
              method="POST",
          )

          with urllib.request.urlopen(requisicao, timeout=10) as resposta:
              assert resposta.status == 200
              resultado = json.load(resposta)

          assert 0 <= resultado["probabilidade_churn"] <= 1
          assert resultado["classificacao"] == 1
          assert resultado["alerta"] is True
          assert resultado["threshold"] == 0.2

          print("Teste POST /prever aprovado.")
          PY

      # 10. Testar dados inconsistentes
      - name: Test invalid churn prediction input
        run: |
          python - <<'PY'
          import json
          import urllib.error
          import urllib.request

          url = "http://127.0.0.1:8000/prever"

          cliente_invalido = {
              "total_atendimentos": 2,
              "atendimentos_abertos": 5,
              "media_satisfacao": 3.5,
          }

          dados = json.dumps(cliente_invalido).encode("utf-8")

          requisicao = urllib.request.Request(
              url,
              data=dados,
              headers={"Content-Type": "application/json"},
              method="POST",
          )

          try:
              with urllib.request.urlopen(requisicao, timeout=10):
                  raise AssertionError("A API aceitou dados invalidos.")
          except urllib.error.HTTPError as erro:
              assert erro.code == 422
              resposta = json.load(erro)
              assert "Atendimentos abertos" in resposta["detail"]

          print("Teste de entrada invalida aprovado: HTTP 422.")
          PY

      # 11. Testar campo obrigatorio ausente
      - name: Test missing required field
        run: |
          python - <<'PY'
          import json
          import urllib.error
          import urllib.request

          url = "http://127.0.0.1:8000/prever"

          cliente_incompleto = {
              "total_atendimentos": 4,
              "atendimentos_abertos": 1,
          }

          dados = json.dumps(cliente_incompleto).encode("utf-8")

          requisicao = urllib.request.Request(
              url,
              data=dados,
              headers={"Content-Type": "application/json"},
              method="POST",
          )

          try:
              with urllib.request.urlopen(requisicao, timeout=10):
                  raise AssertionError(
                      "A API aceitou uma requisicao incompleta."
                  )
          except urllib.error.HTTPError as erro:
              assert erro.code == 422
              resposta = json.load(erro)

              assert any(
                  item["type"] == "missing"
                  and item["loc"] == ["body", "media_satisfacao"]
                  for item in resposta["detail"]
              )

          print("Teste de campo obrigatorio aprovado: HTTP 422.")
          PY

      # 12. Testar tipo de dado incorreto
      - name: Test invalid data type
        run: |
          python - <<'PY'
          import json
          import urllib.error
          import urllib.request

          url = "http://127.0.0.1:8000/prever"

          cliente_tipo_invalido = {
              "total_atendimentos": "sete",
              "atendimentos_abertos": 2,
              "media_satisfacao": 3.5,
          }

          dados = json.dumps(cliente_tipo_invalido).encode("utf-8")

          requisicao = urllib.request.Request(
              url,
              data=dados,
              headers={"Content-Type": "application/json"},
              method="POST",
          )

          try:
              with urllib.request.urlopen(requisicao, timeout=10):
                  raise AssertionError(
                      "A API aceitou um tipo de dado invalido."
                  )
          except urllib.error.HTTPError as erro:
              assert erro.code == 422
              resposta = json.load(erro)

              assert any(
                  item["type"] == "int_type"
                  and item["loc"] == ["body", "total_atendimentos"]
                  for item in resposta["detail"]
              )

          print("Teste de tipo invalido aprovado: HTTP 422.")
          PY

      # 13. Testar limite numerico de satisfacao
      - name: Test satisfaction upper limit
        run: |
          python - <<'PY'
          import json
          import urllib.error
          import urllib.request

          url = "http://127.0.0.1:8000/prever"

          cliente_limite_invalido = {
              "total_atendimentos": 3,
              "atendimentos_abertos": 1,
              "media_satisfacao": 6.0,
          }

          dados = json.dumps(cliente_limite_invalido).encode("utf-8")

          requisicao = urllib.request.Request(
              url,
              data=dados,
              headers={"Content-Type": "application/json"},
              method="POST",
          )

          try:
              with urllib.request.urlopen(requisicao, timeout=10):
                  raise AssertionError(
                      "A API aceitou satisfacao acima do limite."
                  )
          except urllib.error.HTTPError as erro:
              assert erro.code == 422, (
                  f"Esperado HTTP 422, recebido HTTP {erro.code}"
              )
              resposta = json.load(erro)

              assert any(
                  item["type"] == "less_than_equal"
                  and item["loc"] == ["body", "media_satisfacao"]
                  for item in resposta["detail"]
              ), "Erro de limite numerico nao identificado."

          print("Teste de limite numerico aprovado: HTTP 422.")
          PY

      # 14. Remover container temporario
      - name: Remove Docker test container
        if: always()
        run: docker rm -f churn-api-ci || true

